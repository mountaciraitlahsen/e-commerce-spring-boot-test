<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="en">
<body style="margin: 0; padding: 0; font-family: -apple-system, sans-serif; background-color: #f9fafb; color: #1f2937;">
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #f9fafb; padding: 40px 20px;">
    <tr>
        <td align="center">
            <table width="100%" style="max-width: 500px; background-color: #ffffff; border-radius: 12px; padding: 32px; border: 1px solid #e5e7eb;">
                <tr>
                    <td align="center" style="padding-bottom: 24px;">
                        <span style="font-size: 24px; font-weight: 700; color: #4f46e5;">YOURSTORE</span>
                    </td>
                </tr>
                <tr>
                    <td><div style="height: 1px; background-color: #e5e7eb; margin-bottom: 24px;"></div></td>
                </tr>
                <tr>
                    <td style="padding-bottom: 12px;">
                        <h1 style="font-size: 20px; font-weight: 600; color: #111827; margin: 0; text-align: center;">Verify your email address</h1>
                    </td>
                </tr>
                <tr>
                    <td style="padding-bottom: 24px; text-align: center;">
                        <!-- Dynamic Name Binding -->
                        <p style="font-size: 15px; color: #4b5563; line-height: 1.5; margin: 0;">
                            Hi <span th:text="${name}">Customer</span>, thank you for creating an account with us. To complete your registration, please enter the verification code below on the signup page.
                        </p>
                    </td>
                </tr>
                <tr>
                    <td align="center" style="padding-bottom: 24px;">
                        <div style="background-color: #f3f4f6; border-radius: 8px; padding: 16px 32px; display: inline-block;">
                            <!-- Dynamic OTP Binding -->
                            <span th:text="${otpCode}" style="font-family: monospace; font-size: 32px; font-weight: 700; color: #111827; letter-spacing: 4px;">000000</span>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td style="padding-bottom: 24px; text-align: center;">
                        <p style="font-size: 13px; color: #9ca3af; margin: 0;">
                            This code is valid for <strong>10 minutes</strong>. For your security, do not share this code with anyone.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
